<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grassdex</title>
<style>
  :root {
    --paper: #e8eee0;
    --ink: #1d2a20;
    --bilberry: #3d2f73;
    --rule: #b9c7b0;
    --done-bg: #d7e8cb;
    --done-border: #4a7a3b;
    --warn-border: #a86c18;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 16px 14px 40px;
    max-width: 34rem;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 Georgia, serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 1.8rem; }
  .tabs { display: flex; gap: 6px; }
  .tab-btn {
    padding: 6px 14px;
    font: 600 14px system-ui, sans-serif;
    border: 1px solid var(--ink);
    background: none;
    color: var(--ink);
    border-radius: 4px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--ink);
    color: var(--paper);
  }
  #status {
    margin: 10px 0;
    padding: 8px 10px;
    font: 14px system-ui, sans-serif;
    border-radius: 4px;
    background: rgba(0,0,0,0.05);
    display: none;
  }
  #status.show { display: block; }
  .snap-wrap { margin: 12px 0 16px; }
  .snap {
    display: block;
    position: relative;
    text-align: center;
    padding: 14px 12px;
    border-radius: 6px;
    background: var(--bilberry);
    color: #fff;
    font: 600 16px system-ui, sans-serif;
    cursor: pointer;
  }
  .snap:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
  .snap input { position: absolute; opacity: 0; width: 1px; height: 1px; }

  /* Bingo view */
  .bingo-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font: 14px system-ui, sans-serif;
  }
  .bingo-controls select {
    padding: 4px 8px;
    font: inherit;
    border: 1px solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
  }
  .bingo-controls button {
    padding: 4px 10px;
    font: inherit;
    border: 1px solid var(--ink);
    background: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .banner-win {
    padding: 12px;
    margin-bottom: 12px;
    background: #d4ebd0;
    border: 2px solid var(--done-border);
    border-radius: 6px;
    font: 600 17px system-ui, sans-serif;
    text-align: center;
    color: #194d12;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .square {
    min-height: 82px;
    padding: 8px 6px;
    border: 2px solid var(--rule);
    border-radius: 6px;
    background: #f4f8ef;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  .square:focus-visible { outline: 3px solid var(--bilberry); }
  .square.selected {
    border-color: var(--bilberry);
    background: #ece8f5;
  }
  .square.done {
    border-color: var(--done-border);
    background: var(--done-bg);
  }
  .square.override {
    border-color: var(--warn-border);
  }
  .sq-text {
    font: 500 13px/1.3 system-ui, sans-serif;
    word-break: break-word;
  }
  .square.done .sq-text { font-weight: 700; text-decoration: line-through; }
  .sq-badge {
    margin-top: 4px;
    font: 700 11px system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: .5px;
    opacity: .8;
  }
  .sq-override-btn {
    margin-top: 4px;
    padding: 2px 4px;
    font: 11px system-ui, sans-serif;
    border: 1px dashed var(--warn-border);
    background: none;
    color: var(--warn-border);
    border-radius: 3px;
    cursor: pointer;
  }

  /* Dex view */
  #stats { margin: 2px 0 14px; font: 14px system-ui, sans-serif; opacity: .8; }
  .entry {
    padding: 12px 0 12px 10px;
    border-bottom: 1px solid var(--rule);
    border-left: 4px solid var(--rule);
    margin-bottom: 8px;
  }
  .entry.plant { border-left-color: #5b8c4a; }
  .entry.bug { border-left-color: #b8862b; }
  .entry.bird { border-left-color: #3d6f9e; }
  .entry.fungus { border-left-color: #8a5a7a; }
  .entry h3 { margin: 0; font-size: 1.15rem; }
  .meta { font: 13px system-ui, sans-serif; opacity: .75; margin: 2px 0 6px; }
  .entry p { margin: 4px 0 8px; font-size: 15px; }
  .entry-actions { display: flex; gap: 6px; align-items: center; }
  .entry button {
    padding: 3px 8px;
    font: 13px system-ui, sans-serif;
    background: none;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 4px;
    cursor: pointer;
  }
  .entry button.on { background: var(--ink); color: var(--paper); }
  .thumb {
    max-width: 80px;
    max-height: 80px;
    border-radius: 4px;
    float: right;
    margin: 0 0 6px 10px;
    border: 1px solid var(--rule);
  }

  footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font: 12px system-ui, sans-serif;
    opacity: .75;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Grassdex</h1>
  <div class="tabs">
    <button id="tabBingo" class="tab-btn active" onclick="switchTab('bingo')">Bingo</button>
    <button id="tabDex" class="tab-btn" onclick="switchTab('dex')">Dex</button>
  </div>
</header>

<div id="status" role="status"></div>

<div class="snap-wrap">
  <label class="snap" id="snapLabel">
    <span id="snapText">Snap a photo</span>
    <input id="photo" type="file" accept="image/*" capture="environment">
  </label>
</div>

<!-- Bingo View -->
<div id="viewBingo">
  <div class="bingo-controls">
    <label>Setting:
      <select id="settingSelect">
        <option value="park">Park</option>
        <option value="trail">Trail</option>
        <option value="campus">Campus</option>
        <option value="garden">Garden</option>
        <option value="street">Street</option>
      </select>
    </label>
    <button onclick="newCard()">New Card</button>
  </div>

  <div id="winBanner" class="banner-win" style="display:none;">
    🎉 Bingo! Now put the phone away.
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- Dex View -->
<div id="viewDex" style="display:none;">
  <div id="stats">Loading log...</div>
  <div id="list"></div>
</div>

<footer>
  Stay safe. Do not touch, pick or approach anything. Not for eating or medical decisions.
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let currentTab = "bingo";
let bingoCard = null;
let selectedSquare = null;
let log = [];

function switchTab(tab) {
  currentTab = tab;
  $("tabBingo").className = "tab-btn" + (tab === "bingo" ? " active" : "");
  $("tabDex").className = "tab-btn" + (tab === "dex" ? " active" : "");
  $("viewBingo").style.display = tab === "bingo" ? "block" : "none";
  $("viewDex").style.display = tab === "dex" ? "block" : "none";
  updateSnapLabel();
}

function updateSnapLabel() {
  if (currentTab === "bingo" && selectedSquare !== null && bingoCard && bingoCard.squares[selectedSquare]) {
    const sq = bingoCard.squares[selectedSquare];
    $("snapText").textContent = `Snap for: "${sq.text}"`;
  } else {
    $("snapText").textContent = "Snap a photo";
  }
}

function checkWin(squares) {
  if (!squares || squares.length !== 9) return false;
  const isDone = i => squares[i].status === "done";
  const lines = [
    [0,1,2], [3,4,5], [6,7,8], // rows
    [0,3,6], [1,4,7], [2,5,8], // cols
    [0,4,8], [2,4,6]           // diagonals
  ];
  return lines.some(line => line.every(isDone));
}

function renderBingo() {
  if (!bingoCard || !bingoCard.squares) return;
  const won = checkWin(bingoCard.squares);
  $("winBanner").style.display = won ? "block" : "none";

  const grid = $("grid");
  grid.innerHTML = bingoCard.squares.map((sq, i) => {
    const isSelected = selectedSquare === i;
    const isDone = sq.status === "done";
    const isOverride = sq.override === true;
    let cls = "square";
    if (isSelected) cls += " selected";
    if (isDone) cls += " done";
    if (isOverride) cls += " override";

    let badge = isDone ? (isOverride ? "done (manual)" : "done ✓") : "open";
    let overrideBtn = (!isDone)
      ? `<button class="sq-override-btn" onclick="overrideSquare(event, ${i})">Override</button>`
      : "";

    return `
      <div class="${cls}" onclick="selectSquare(${i})">
        <div class="sq-text">${esc(sq.text)}</div>
        <div>
          <div class="sq-badge">${badge}</div>
          ${overrideBtn}
        </div>
      </div>
    `;
  }).join("");
  updateSnapLabel();
}

function selectSquare(i) {
  if (selectedSquare === i) {
    selectedSquare = null;
  } else {
    selectedSquare = i;
  }
  renderBingo();
}

async function overrideSquare(ev, i) {
  ev.stopPropagation();
  try {
    const r = await fetch("/api/bingo/override", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ square: i })
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    bingoCard = data.card;
    renderBingo();
  } catch(e) {
    showStatus("Could not override square.");
  }
}

async function newCard() {
  const setting = $("settingSelect").value;
  showStatus("Generating outdoor bingo card with local Gemma...");
  try {
    const r = await fetch("/api/bingo/new", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ setting })
    });
    if (!r.ok) throw new Error();
    bingoCard = await r.json();
    selectedSquare = null;
    hideStatus();
    renderBingo();
  } catch(e) {
    showStatus("Card generation failed. Ollama may be busy.");
  }
}

function renderDex() {
  const rated = log.filter(e => e.correct !== null);
  const right = rated.filter(e => e.correct === true).length;
  if (log.length) {
    $("stats").textContent = log.length + " logged" + (rated.length ? `, ${right} of ${rated.length} IDs right` : "");
  } else {
    $("stats").textContent = "Nothing logged yet. Go outside.";
  }

  $("list").innerHTML = log.map((e, i) => `
    <div class="entry ${esc(e.kind)}">
      ${e.photo ? `<img class="thumb" src="/data/photos/${esc(e.photo)}" alt="${esc(e.name)}">` : ""}
      <h3>${esc(e.name)}</h3>
      <div class="meta">${esc(e.kind)}, ${esc(e.confidence)}% confidence, ${esc(e.seconds)} s</div>
      <p>${esc(e.fun_fact)}</p>
      ${e.match_reason ? `<p style="font-size:13px;opacity:.8;margin:2px 0;"><strong>Square:</strong> ${esc(e.match_reason)}</p>` : ""}
      <div class="entry-actions">
        <button class="${e.correct === true ? "on" : ""}" onclick="mark(${i}, true)">Right</button>
        <button class="${e.correct === false ? "on" : ""}" onclick="mark(${i}, false)">Wrong</button>
      </div>
    </div>
  `).slice().reverse().join("");
}

function showStatus(text) {
  const el = $("status");
  el.textContent = text;
  el.className = "show";
}

function hideStatus() {
  const el = $("status");
  el.textContent = "";
  el.className = "";
}

async function load() {
  try {
    const [lRes, bRes] = await Promise.all([
      fetch("/api/log"),
      fetch("/api/bingo")
    ]);
    log = await lRes.json();
    bingoCard = await bRes.json();
    renderBingo();
    renderDex();
  } catch (e) {
    showStatus("Could not connect to Grassdex server.");
  }
}

async function mark(i, correct) {
  await fetch("/api/mark", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ i, correct })
  });
  log = await (await fetch("/api/log")).json();
  renderDex();
}

$("photo").onchange = async ev => {
  const file = ev.target.files[0];
  if (!file) return;

  const targetIdx = (currentTab === "bingo") ? selectedSquare : null;
  const squareLabel = (targetIdx !== null && bingoCard && bingoCard.squares[targetIdx]) ? ` for "${bingoCard.squares[targetIdx].text}"` : "";
  showStatus(`Identifying${squareLabel} with local Gemma...`);

  const fd = new FormData();
  fd.append("photo", file);
  if (targetIdx !== null) {
    fd.append("square", targetIdx);
  }

  try {
    const r = await fetch("/api/identify", { method: "POST", body: fd });
    if (!r.ok) throw new Error(r.status);
    const result = await r.json();

    if (targetIdx !== null) {
      if (result.square_match) {
        showStatus(`✓ Satisfied: "${bingoCard.squares[targetIdx].text}" (${result.name})`);
      } else {
        showStatus(`✗ Did not match square (${result.name}): ${result.match_reason || "Check override if correct"}`);
      }
    } else {
      showStatus(`Identified: ${result.name} (${result.confidence}%)`);
    }

    await load();
  } catch(e) {
    showStatus("Couldn't reach Ollama. Start it, then snap again.");
  }
  ev.target.value = "";
};

load();
</script>
</body>
</html>
